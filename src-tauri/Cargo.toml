[package]
name = "drophoto"
description = "Subscription-free photo library over your own drives"
authors = ["Ahmed Abouelleil"]
edition.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drophoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio-util = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dp-core = { path = "../crates/dp-core" }
dp-volumes = { path = "../crates/dp-volumes" }
dp-catalog = { path = "../crates/dp-catalog" }
dp-hash = { path = "../crates/dp-hash" }
dp-metadata = { path = "../crates/dp-metadata" }
dp-thumbs = { path = "../crates/dp-thumbs" }
dp-jobs = { path = "../crates/dp-jobs" }
dp-organize = { path = "../crates/dp-organize" }

[dev-dependencies]
tempfile = "3"

